[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orbis-framework"
version = "0.1.1"
description = "Execution-first ML framework with explicit semantics"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Orbis Contributors" }
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orbis*"]
